<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Action attribute is used to define what action needs to be performed when a form is submitted or where the form data should be sent...  -->

    <!-- <form action="/action.php" > </form> -> example -->

    <!-- Input

    . This is the most important element of form ...
    . there are multiple types of inputs taht can be created using type attribute ...
    
    . this is used to create multiple form controls ... 
    . that means it is used to get multiple types of input from the user ....

    -->

    <!-- type attribute

    type = text, password, number ,time , color etc.... 
    
    -->

    <!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/input Just went through this doc for understanding of this topic  -->

    <form action="/action">
      User Name
      <input type="text" placeholder="Enter User Name" />
      <br />
      password
      <input type="password" placeholder="Enter Your Password" />
      <br />
      Number
      <input type="number" placeholder="Enter Your Age" />
      <br />
      Time
      <input type="time" />
      <br />
      Color
      <input type="color" />
      <br />
      <button>Submit</button>
    </form>
  </body>
</html>
