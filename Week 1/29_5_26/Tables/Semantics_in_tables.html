<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <!-- 

    Semantics in the tables .... 

    
    <thead></thead> -> to wrap table header
    <tbody></tbody> -> to wrap table body
    <tfoot></tfoot> -> to wrap table footer
-->
    <table border="black">
      <!-- border is acutally the part of css ... but it is not the best wat of creating a border ....  -->
      <caption>
        Student Data
      </caption>

      <!-- Table Header  -->

      <thead>
        <tr>
          <th>Name</th>
          <th>Roll No</th>
        </tr>
      </thead>

      <!--
            <tr></tr> -> this is used to display table row
            
            <td></td> -> this is used to display table data
            
            <th></th> -> this is used to display table header
        -->

      <!-- Table body  -->

      <tbody>
        <tr>
          <td>Sonu</td>
          <td>233</td>
        </tr>
        <tr>
          <td>Aman</td>
          <td>289</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
