<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <span class="logo">OPEN WEATHER</span>
    <span class="tagline">Real-time weather App</span>
  </header>

  <main>
    <div class="search-wrap">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" id="cityInput" placeholder="Enter city name…" autocomplete="off" />
        <button id="searchBtn">Search</button>
      </div>
      <p class="hint" id="hint">Try "London", "Tokyo" or "New York"</p>
    </div>

    <div class="card" id="weatherCard">
      <div class="card-top">
        <div class="location-row">
          <span class="city-name" id="cityName">—</span>
          <span class="country" id="country"></span>
        </div>
        <span class="condition" id="condition">—</span>
      </div>

      <div class="temp-display">
        <span class="temp-value" id="temp">—</span>
        <span class="temp-unit">°C</span>
      </div>

      <div class="feels-row">
        Feels like <span id="feelsLike">—</span>°C &nbsp;·&nbsp; High <span id="tempMax">—</span>° &nbsp;·&nbsp; Low
        <span id="tempMin">—</span>°
      </div>

      <div class="divider"></div>

      <div class="stats-grid">
        <div class="stat">
          <span class="stat-label">Humidity</span>
          <span class="stat-value" id="humidity">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Wind</span>
          <span class="stat-value" id="wind">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Visibility</span>
          <span class="stat-value" id="visibility">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">Pressure</span>
          <span class="stat-value" id="pressure">—</span>
        </div>
      </div>
    </div>

    <div class="error-box" id="errorBox">
      <span id="errorMsg">City not found. Check the spelling and try again.</span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
