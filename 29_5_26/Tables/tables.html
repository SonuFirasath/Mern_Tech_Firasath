<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <!-- Table are used to represent the real life table data in html .... 

    Before We go deep into table there are some attributes that we need to understand , and they are : 

    Row, col, and table header ...

        column
        ^
        |
        |
    Name Rollno  -> Header
    Sonu 233    -> row
    Aman 289    -> row  
    
    table systax .........

    -->

    <table border="black">
      <!-- border is acutally the part of css ... but it is not the best wat of creating a border ....  -->
      <caption>
        Student Data
      </caption>
      <tr>
        <th>Name</th>
        <th>Roll No</th>
      </tr>

      <!--
            <tr></tr> -> this is used to display table row
            
            <td></td> -> this is used to display table data
            
            <th></th> -> this is used to display table header
        -->

      <tr>
        <td>Sonu</td>
        <td>233</td>
      </tr>
      <tr>
        <td>Aman</td>
        <td>289</td>
      </tr>
    </table>
  </body>
</html>
